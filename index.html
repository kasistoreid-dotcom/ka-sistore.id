<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KASISTORE ID</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',sans-serif;background:#060818;color:#fff}

/* HEADER */
header{ text-align:center; padding:16px; background:linear-gradient(90deg,#6d28d9,#9333ea,#4f46e5); box-shadow:0 0 15px rgba(147,51,234,.6)}

/* BANNER */
.banner{ margin:15px; height:200px; border-radius:12px; background:url('https://i.imgur.com/y3XrbYh.png') center/cover no-repeat; position:relative; overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.7)}

.section{padding:15px;max-width:900px;margin:auto}

/* GAME GRID */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
.game{background:#111827;padding:12px;border-radius:12px;text-align:center;cursor:pointer;transition:.25s}
.game:hover{transform:translateY(-5px);box-shadow:0 0 15px #9333ea}
.game.active{border:2px solid #9333ea}

/* INPUT */
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #1f2937;background:#020617;color:#fff}

/* NOMINAL GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-height:300px;overflow:auto}
.card{background:#111827;padding:12px;border-radius:12px;text-align:center;cursor:pointer;transition:.25s}
.card:hover{transform:scale(1.05);box-shadow:0 0 12px #9333ea}
.card.selected{background:#ec4899;color:#fff;box-shadow:0 0 12px #ec4899}

/* PAYMENT */
.pay{background:#111827;padding:10px;border-radius:10px;margin:6px 0;cursor:pointer;transition:.2s}
.pay:hover{box-shadow:0 0 10px #9333ea}
.pay.selected{border:2px solid #ec4899}

/* BUTTON */
button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#9333ea,#ec4899);color:#fff;font-weight:bold;cursor:pointer;transition:.25s}
button:hover{transform:scale(1.03);box-shadow:0 0 15px #ec4899}

h3{margin-top:18px;margin-bottom:8px;color:#c4b5fd}

</style>
</head>

<body>

<header>
<h2>KASISTORE ID</h2>
</header>

<div class="banner"></div>

<div class="section">

<h3>Pilih Game</h3>
<div class="games">
<div class="game" onclick="selectGame('mlbb',this)">MLBB</div>
<div class="game" onclick="selectGame('ff',this)">Free Fire</div>
<div class="game" onclick="selectGame('pubg',this)">PUBG</div>
</div>

<h3>Masukkan Data</h3>
<input id="userId" placeholder="User ID">
<input id="serverId" placeholder="Server">

<h3>Pilih Nominal</h3>
<div id="produk" class="grid"></div>

<h3>Pembayaran</h3>
<div class="pay" onclick="selectPay(this,'DANA')">DANA</div>
<div class="pay" onclick="selectPay(this,'OVO')">OVO</div>
<div class="pay" onclick="selectPay(this,'QRIS')">QRIS</div>

<button onclick="order()">ORDER SEKARANG</button>

</div>

<script>
const data={mlbb:[["5 Diamond",1550],["12 Diamond",3436],["14 Diamond",4148],["19 Diamond",5440],["22 Diamond",6403],["28 Diamond",7751],["30 Diamond",8375],["33 Diamond",9375],["36 Diamond",9760],["44 Diamond",11800],["59 Diamond",15398],["74 Diamond",19126],["85 Diamond",22295],["86 Diamond",22245],["100 Diamond",26521],["140 Diamond",37175],["170 Diamond",44540],["172 Diamond",44818],["185 Diamond",48475],["222 Diamond",57175],["240 Diamond",66025],["257 Diamond",67014],["296 Diamond",75123],["344 Diamond",88624],["370 Diamond",94525],["380 Diamond",96830],["429 Diamond",109275],["514 Diamond",130819],["706 Diamond",180452],["875 Diamond",218579],["878 Diamond",224053],["963 Diamond",246255],["1159 Diamond",297925],["1412 Diamond",355423],["2010 Diamond",486501],["2195 Diamond",527673]],
ff:[["5 Diamond",1055],["10 Diamond",2098],["12 Diamond",2050],["20 Diamond",3600],["25 Diamond",4369],["30 Diamond",5400],["50 Diamond",7110],["70 Diamond",6625],["75 Diamond",9250],["80 Diamond",10049],["90 Diamond",11055],["100 Diamond",13100],["120 Diamond",12769],["140 Diamond",16575],["150 Diamond",18300],["200 Diamond",20275],["210 Diamond",27520],["280 Diamond",36989],["355 Diamond",45725],["400 Diamond",52602],["500 Diamond",64878],["510 Diamond",66830],["720 Diamond",90771],["1000 Diamond",129587],["1450 Diamond",183730],["2000 Diamond",262071],["2180 Diamond",280920],["3640 Diamond",463463]],
pubg:[["26 UC",8300],["35 UC",15276],["50 UC",15778],["60 UC",16900],["70 UC",30541],["100 UC",30501],["120 UC",29100],["131 UC",34275],["150 UC",43100],["175 UC",42100],["180 UC",59856],["210 UC",58600],["263 UC",72600],["300 UC",87700],["375 UC",92992],["700 UC",156175],["825 UC",179100],["1000 UC",230100]]};

let currentGame="";let selectedItem="";let selectedPay="";

function selectGame(game,el){
 currentGame=game;
 document.querySelectorAll('.game').forEach(g=>g.classList.remove('active'));
 el.classList.add('active');

 let box=document.getElementById('produk');
 box.innerHTML="";

 data[game].forEach(item=>{
   let div=document.createElement('div');
   div.className='card';
   div.innerHTML=item[0]+"<br>Rp "+item[1].toLocaleString();
   div.onclick=()=>{
     document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
     div.classList.add('selected');
     selectedItem=item[0]+" - Rp "+item[1].toLocaleString();
   };
   box.appendChild(div);
 });
}

function selectPay(el,metode){
 document.querySelectorAll('.pay').forEach(p=>p.classList.remove('selected'));
 el.classList.add('selected');
 selectedPay=metode;
}

function order(){
 let id=document.getElementById('userId').value.trim();
 let server=document.getElementById('serverId').value.trim();

 if(!currentGame||!selectedItem||!selectedPay||!id){
   alert('Lengkapi semua data!');
   return;
 }

 let text=encodeURIComponent(
   "ORDER TOP UP\n\nGame: "+currentGame.toUpperCase()+
   "\nID: "+id+
   "\nServer: "+server+
   "\nItem: "+selectedItem+
   "\nPembayaran: "+selectedPay
 );

 window.open("https://wa.me/6285126902348?text="+text);
}
</script>

</body>
</html>
