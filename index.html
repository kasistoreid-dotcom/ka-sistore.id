<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Up Game Murah</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
}

header {
    text-align: center;
    padding: 20px;
    background: #1e293b;
    font-size: 24px;
    font-weight: bold;
}

.container {
    padding: 20px;
}

.game-title {
    margin-top: 30px;
    font-size: 22px;
    border-left: 5px solid #38bdf8;
    padding-left: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    background: #38bdf8;
    color: black;
}

.selected {
    background: #22c55e !important;
    color: black;
}

.order-box {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #020617;
    padding: 15px;
    text-align: center;
}

button {
    background: #25D366;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>
<body>

<header>TOP UP GAME MURAH</header>
<p class="info">⚡ Proses 1-5 menit setelah pembayaran</p>
</header>

<div class="container">

<label>Pilih Game</label>
<select id="game">
<option value="MLBB">Mobile Legends</option>
<option value="Free Fire">Free Fire</option>
<option value="PUBG">PUBG Mobile</option>
</select>

<input type="text" id="id" placeholder="Masukkan ID Game">
<input type="text" id="server" placeholder="Server (khusus MLBB)">
<input type="text" id="nick" placeholder="Nickname">

<div class="game-title">MLBB</div>
<div class="grid" id="mlbb"></div>

<div class="game-title">FREE FIRE</div>
<div class="grid" id="ff"></div>

<div class="game-title">PUBG</div>
<div class="grid" id="pubg"></div>

</div>

<div class="order-box">
    <div id="selectedItem">Pilih diamond dulu</div>
	<div class="grid" id="list"></div>
    <br>
    <button onclick="orderWA()">Order via WhatsApp</button>
</div>

let selectedText = "";

function render(id, list) {
    const container = document.getElementById(id);
    list.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<b>${item[0]}</b><br>Rp ${item[1].toLocaleString()}`;
        div.onclick = () => selectItem(div, item);
        container.appendChild(div);
    });
}

function selectItem(el, item) {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");
    selectedText = item[0] + " - Rp " + item[1].toLocaleString();
    document.getElementById("selectedItem").innerText = selectedText;
}

function orderWA() {
    if (!selectedText) {
        alert("Pilih diamond dulu!");
        return;
    }
    let nomor = "6285126902348"; // GANTI NOMOR KAMU
    let pesan = encodeURIComponent("Halo, saya mau order:\n" + selectedText);
    window.open(`https://wa.me/${nomor}?text=${pesan}`);
}

render("mlbb", data.mlbb);
render("ff", data.ff);
render("pubg", data.pubg);
</script>

</body>
</html>
