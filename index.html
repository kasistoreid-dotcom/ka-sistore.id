<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Up Game Murah</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
}

header {
    text-align: center;
    padding: 20px;
    background: #1e293b;
    font-size: 24px;
    font-weight: bold;
}

.container {
    padding: 20px;
}

.game-title {
    margin-top: 30px;
    font-size: 22px;
    border-left: 5px solid #38bdf8;
    padding-left: 10px;
}

.grid {
    scroll-behavior: smooth;
	display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 10px;
	
	max-height: 300px;
	overflow-y: auto;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    background: #38bdf8;
    color: black;
}

.selected {
    background: #22c55e !important;
    color: black;
}

.order-box {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #020617;
    padding: 15px;
    text-align: center;
}

button {
    background: #25D366;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
<h1>KA SISTORE ID</h1>
<p>Top Up Murah ⚡ Proses Cepat ⚡ Aman & Terpercaya</p>
</header>

<div class="container">

<label>pilih game</label>
<select id="game"
<option value="MLBB">Mobile Legends</option>
<option value="Free Fire">Free Fire</option>
<option value="PUBG">PUBG Mobile</option>
</select>

<input type="text" id="id" placeholder="Masukkan ID Game">
<input type="text" id="server" placeholder="Server (khusus MLBB)">
<input type="text" id="nick" placeholder="Nickname">

<div class="game-title">pilih Diamond</div>
<div class="grid" id="list"></div>

<p class="info">⚡ Proses 1-5 menit setelah pembayaran</p>

</div>

<div class="order-box">
    <div id="selected">belum Pilih diamond dulu</div>
    <br>
    <button onclick="orderWA()">ORDER SEKARANG</button>
</div>

<script>
const data = {

let selectedText = "";

function render() {
    let game = document.getElementById("game").value;
    let container = document.getElementById("list");
    container.innerHTML = "";

    data[game].forEach(item => {
        let div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<b>${item[0]}</b><br>Rp ${item[1].toLocaleString()}`;
        div.onclick = () => select(div, item);
        container.appendChild(div);
    });
}

function select(el, item) {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");
    selectedItem = item;
    document.getElementById("selected").innerText =
        item[0] + " - Rp " + item[1].toLocaleString();
}

function orderWA() {
    let game = document.getElementById("game").value;
    let id = document.getElementById("id").value;
    let server = document.getElementById("server").value;
    let nick = document.getElementById("nick").value;

    if (!selectedItem || !id) {
        alert("Lengkapi data dulu!");
        return;
    }

    let pesan = `Halo admin, saya mau order:

Game: ${game}
Item: ${selectedItem[0]}
Harga: Rp ${selectedItem[1].toLocaleString()}
ID: ${id}
Server: ${server}
Nickname: ${nick}`;

    let nomor = "6285126902348"; // GANTI NOMOR KAMU
    let pesan = encodeURIComponent("Halo, saya mau order:\n" + selectedText);
    window.open(`https://wa.me/${nomor}?text=${pesan}`);
}

document.getElementById("game").addEventListener("change", render);
render();
</script>

</body>
</html>
