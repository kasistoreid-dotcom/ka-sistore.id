<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',sans-serif;background:#060818;color:#fff}

header{ text-align:center; padding:16px; background:linear-gradient(90deg,#6d28d9,#9333ea,#4f46e5); box-shadow:0 0 15px rgba(147,51,234,.6)}

.banner{ margin:15px; height:200px; border-radius:12px; background:url('https://i.imgur.com/y3XrbYh.png') center/cover no-repeat; position:relative}
.banner::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.7)}

.section{padding:15px;max-width:900px;margin:auto}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
.game{background:#111827;padding:12px;border-radius:12px;text-align:center;cursor:pointer;transition:.25s}
.game:hover{transform:translateY(-5px);box-shadow:0 0 15px #9333ea}
.game.active{border:2px solid #9333ea}

input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #1f2937;background:#020617;color:#fff}

.nickname{
  font-size:13px;
  color:#22c55e;
  margin-bottom:10px;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-height:300px;overflow:auto}

.card{background:#111827;padding:12px;border-radius:12px;text-align:center;cursor:pointer;transition:.25s;position:relative}
.card:hover{transform:scale(1.05);box-shadow:0 0 12px #9333ea}
.card.selected{background:#ec4899;color:#fff;box-shadow:0 0 12px #ec4899}

.badge{
 position:absolute;
 top:5px;
 right:5px;
 font-size:10px;
 padding:3px 6px;
 border-radius:6px;
 background:#22c55e;
}

.old{
 text-decoration:line-through;
 font-size:11px;
 color:#9ca3af;
}

.pay{background:#111827;padding:10px;border-radius:10px;margin:6px 0;cursor:pointer}
.pay.selected{border:2px solid #ec4899}

button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#9333ea,#ec4899);color:#fff;font-weight:bold;cursor:pointer}

h3{margin-top:18px;margin-bottom:8px;color:#c4b5fd}

.badge-hot{background:#ef4444}
.badge-promo{background:#f59e0b}
.badge-murah{background:#22c55e}

.testimoni{
 margin-top:25px;
}
.testi-box{
 background:#111827;
 padding:12px;
 border-radius:10px;
 margin-bottom:10px;
 font-size:13px;
 color:#d1d5db;
}

/* NOTIF */
.notif{
 position:fixed;
 bottom:20px;
 left:20px;
 background:#111827;
 padding:10px 14px;
 border-radius:10px;
 box-shadow:0 0 15px #9333ea;
 font-size:13px;
 display:none;
 animation:fadeIn .5s;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* TIMER */
.timer{
 margin-top:10px;
 background:#111827;
 padding:10px;
 border-radius:10px;
 text-align:center;
 font-size:14px;
 color:#fbbf24;
}
</style>
</head>

let currentGame="";let selectedItem="";let selectedPay="";

function selectGame(game,el){
 currentGame=game;
 document.querySelectorAll('.game').forEach(g=>g.classList.remove('active'));
 el.classList.add('active');

 let box=document.getElementById('produk');
 box.innerHTML="";

 data[game].forEach(item=>{
   let div=document.createElement('div');
   div.className='card';

   if(item.best){
     div.innerHTML+="<div class='badge'>BEST</div>";
   }
   if(Math.random()<0.3){div.innerHTML+="<div class='badge badge-hot'>HOT</div>"}
   if(Math.random()<0.3){div.innerHTML+="<div class='badge badge-promo'>PROMO</div>"}
   if(Math.random()<0.3){div.innerHTML+="<div class='badge badge-murah'>MURAH</div>"}

   div.innerHTML+=`<b>${item.n}</b><br>`;

   if(item.old){
     div.innerHTML+=`<span class='old'>Rp ${item.old}</span><br>`;
   }

   div.innerHTML+=`Rp ${item.h}`;

   div.onclick=()=>{
     document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
     div.classList.add('selected');
     selectedItem=item.n+" - Rp "+item.h;
   };

   box.appendChild(div);
 });
}

function cekNickname(){
 let id=document.getElementById('userId').value;
 let nick=document.getElementById('nick');

 if(id.length<5){
   nick.innerHTML="";
   return;
 }

 nick.innerHTML="Checking nickname...";

 // simulasi auto nickname (fake API)
 setTimeout(()=>{
   nick.innerHTML="Nickname: Player_"+id.slice(-4);
 },800);
}

function selectPay(el,metode){
 document.querySelectorAll('.pay').forEach(p=>p.classList.remove('selected'));
 el.classList.add('selected');
 selectedPay=metode;
}

function order(){
 let id=document.getElementById('userId').value.trim();
 let server=document.getElementById('serverId').value.trim();
 let nick=document.getElementById('nick').innerText;

 if(!currentGame||!selectedItem||!selectedPay||!id){
   alert('Lengkapi semua data!');
   return;
 }

 let text=encodeURIComponent(
   "ORDER TOP UP\n\nGame: "+currentGame.toUpperCase()+
   "\nID: "+id+
   "\n"+nick+
   "\nServer: "+server+
   "\nItem: "+selectedItem+
   "\nPembayaran: "+selectedPay

 window.open("https://wa.me/6285126902348?text="+text);
}

<script>

function showNotif(){

 notif.innerText=`${n} baru saja membeli ${p}`;
 notif.style.display='block';
 setTimeout(()=>{notif.style.display='none'},3000);
}

setInterval(showNotif,5000);

// TIMER PROMO
let time=300;
function startTimer(){
 let t=document.getElementById('timer');
 setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  t.innerText=`Promo berakhir dalam: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  if(time>0) time--;
 },1000);
}
startTimer();
