<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KASISTORE ID</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI';
    background:#020617;
    color:white;
}

/* HEADER */
header {
    text-align:center;
    padding:15px;
    background:linear-gradient(90deg,#22c55e,#2563eb);
}

/* BANNER FIX */
.banner {
    margin:15px;
    height:200px;
    border-radius:12px;
    background:url('https://i.imgur.com/y3XrbYh.png') center/cover no-repeat;
    position:relative;
}

/* overlay biar kebaca */
.banner::before {
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
}

/* SECTION */
.section {
    padding:15px;
}

/* GAME */
.games {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}
.game {
    background:#111827;
    padding:10px;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
}
.game.active {
    border:2px solid #22c55e;
}

/* INPUT */
input {
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:1px solid #1f2937;
    background:#020617;
    color:white;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    max-height:260px;
    overflow:auto;
}
.card {
    background:#111827;
    padding:10px;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
}
.card.selected {
    background:#22c55e;
    color:black;
}

/* PAYMENT */
.pay {
    background:#111827;
    padding:10px;
    border-radius:10px;
    margin:5px 0;
    cursor:pointer;
}
.pay.selected {
    border:2px solid #22c55e;
}

/* BUTTON */
button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h2>KASISTORE ID</h2>
</header>

<div class="banner"></div>

<div class="section">

<h3>Pilih Game</h3>
<div class="games">
<div class="game" onclick="selectGame('mlbb',this)">MLBB</div>
<div class="game" onclick="selectGame('ff',this)">Free Fire</div>
<div class="game" onclick="selectGame('pubg',this)">PUBG</div>
</div>

<h3>Masukkan Data</h3>
<input id="userId" placeholder="User ID">
<input id="serverId" placeholder="Server">

<h3>Pilih Nominal</h3>
<div id="produk" class="grid"></div>

<h3>Pembayaran</h3>
<div class="pay" onclick="selectPay(this,'DANA')">DANA</div>
<div class="pay" onclick="selectPay(this,'OVO')">OVO</div>
<div class="pay" onclick="selectPay(this,'QRIS')">QRIS</div>

<button onclick="order()">ORDER SEKARANG</button>

</div>

<script>

const data = {

["700 UC",156175],["825 UC",179100],["1000 UC",230100]
]

};

let currentGame="";
let selectedItem="";
let selectedPay="";

function selectGame(game,el){
    currentGame=game;
    document.querySelectorAll(".game").forEach(g=>g.classList.remove("active"));
    el.classList.add("active");

    let box=document.getElementById("produk");
    box.innerHTML="";

    data[game].forEach(item=>{
        let div=document.createElement("div");
        div.className="card";
        div.innerHTML=item[0]+"<br>Rp "+item[1].toLocaleString();
        div.onclick=()=>{
            document.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));
            div.classList.add("selected");
            selectedItem=item[0]+" - Rp "+item[1].toLocaleString();
        };
        box.appendChild(div);
    });
}

function selectPay(el,metode){
    document.querySelectorAll(".pay").forEach(p=>p.classList.remove("selected"));
    el.classList.add("selected");
    selectedPay=metode;
}

function order(){
    let id=document.getElementById("userId").value.trim();
    let server=document.getElementById("serverId").value.trim();

    if(!currentGame || !selectedItem || !selectedPay || !id){
        alert("Lengkapi semua data!");
        return;
    }

    let text=encodeURIComponent(
        "ORDER TOP UP\n\nGame: "+currentGame.toUpperCase()+
        "\nID: "+id+
        "\nServer: "+server+
        "\nItem: "+selectedItem+
        "\nPembayaran: "+selectedPay
    );

    window.open("https://wa.me/6285126902348?text="+text);
}
</script>

</body>
</html>
