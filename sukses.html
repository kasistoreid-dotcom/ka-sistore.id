<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran Berhasil</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#060818;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.box{
  background:#020617;
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(147,51,234,.5);
  max-width:350px;
  width:90%;
}

.check{
  font-size:60px;
  color:#22c55e;
  animation:pop .5s ease;
}

h2{
  margin-top:10px;
  color:#c084fc;
}

p{
  font-size:14px;
  color:#cbd5f5;
}

button{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#9333ea,#ec4899);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

@keyframes pop{
  from{transform:scale(0);}
  to{transform:scale(1);}
}
</style>
</head>

<body>

<div class="box">
  <div class="check">✔️</div>
  <h2>Pembayaran Diproses</h2>
  <p>Terima kasih! Bukti transfer kamu sudah dikirim.<br>
  Admin akan segera memproses pesanan kamu.</p>

  <button onclick="kembali()">Kembali ke Beranda</button>
</div>

<script>
function kembali(){
  window.location.href="index.html";
}
</script>

</body>
</html>
