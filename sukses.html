<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran Berhasil</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#060818;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.box{
  background:#020617;
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(147,51,234,.5);
  max-width:350px;
  width:90%;
}

.check{
  font-size:60px;
  color:#22c55e;
  animation:pop .5s ease;
}

h2{
  margin-top:10px;
  color:#c084fc;
}

p{
  font-size:14px;
  color:#cbd5f5;
}

button{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#9333ea,#ec4899);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

@keyframes pop{
  from{transform:scale(0);}
  to{transform:scale(1);}
}

#statusOrder.success{
  transform: scale(1.05);
}

</style>
</head>

<body>

<div class="box">
  <div class="check">✔️</div>
  <h2>Pembayaran Diproses</h2>
 <div id="dataOrder" style="margin-top:10px;font-size:14px;color:#cbd5f5"></div>

<div id="statusOrder" style="
  margin-top:15px;
  padding:10px;
  border-radius:10px;
  background:#111827;
  color:#fbbf24;
  font-weight:bold;
">
⏳ Menunggu Pembayaran...
</div>

<script>
// ambil data
let invoice = localStorage.getItem("invoice") || "-";
let game = localStorage.getItem("game") || "-";
let item = localStorage.getItem("item") || "-";

// tampilkan data
document.getElementById("dataOrder").innerHTML =
  "<b>Invoice:</b> "+invoice+"<br>"+
  "Game: "+game+"<br>"+
  "Item: "+item;

// 🔥 status otomatis berubah
setTimeout(()=>{
  let status = document.getElementById("statusOrder");

  status.innerHTML = "✅ Pembayaran Berhasil 🎉";
  status.style.color = "#fff";
  status.style.background = "linear-gradient(90deg,#22c55e,#4ade80)";
  status.style.boxShadow = "0 0 15px #22c55e";
 
 status.classList.add("success"); // ⬅️ TARUH DI SINI
 
},4000);
</script>
  <button onclick="kembali()">Kembali ke Beranda</button>
</div>

<script>
function kembali(){
  window.location.href="index.html";
}
</script>

</body>
</html>
